<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Salohiddin - Zamonaviy, chiroyli va qulay kalkulyator veb-ilovasi">
  <title>Salohiddin | Smart Calculator</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <main class="app-container">
    <!-- Calculator Card -->
    <section class="calculator-card" aria-label="Salohiddin Kalkulyatori">
      
      <!-- Top Bar / Header -->
      <header class="calc-header">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="3"></rect>
              <line x1="8" y1="6" x2="16" y2="6"></line>
              <line x1="16" y1="14" x2="16" y2="18"></line>
              <path d="M16 10h.01"></path>
              <path d="M12 10h.01"></path>
              <path d="M8 10h.01"></path>
              <path d="M12 14h.01"></path>
              <path d="M8 14h.01"></path>
              <path d="M12 18h.01"></path>
              <path d="M8 18h.01"></path>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Salohiddin</span>
            <span class="brand-badge">PRO v2.0</span>
          </div>
        </div>

        <div class="header-actions">
          <!-- Sound Toggle -->
          <button id="soundToggle" class="icon-btn" title="Ovozni yoqish / o'chirish" aria-label="Ovoz">
            <svg id="soundIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>

          <!-- History Toggle -->
          <button id="historyToggle" class="icon-btn" title="Tarixni ko'rish" aria-label="Hisob-kitoblar tarixi">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>

          <!-- Theme Switcher -->
          <button id="themeToggle" class="icon-btn" title="Mavzuni almashtirish" aria-label="Mavzu">
            <svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Mode Selector (Standard / Scientific) -->
      <nav class="mode-tabs">
        <button class="mode-tab active" data-mode="standard">Oddiy</button>
        <button class="mode-tab" data-mode="scientific">Muhandislik</button>
      </nav>

      <!-- Display Screen -->
      <div class="display-container">
        <div class="display-formula" id="displayFormula" title="Amallar ketma-ketligi"></div>
        <div class="display-main-row">
          <button id="copyBtn" class="copy-pill" title="Natijani nusxalash">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copyText">Nusxa</span>
          </button>
          <div class="display-value" id="displayValue">0</div>
        </div>
      </div>

      <!-- Memory Bar -->
      <div class="memory-bar">
        <button class="mem-btn" data-mem="MC" title="Xotirani tozalash">MC</button>
        <button class="mem-btn" data-mem="MR" title="Xotiradan o'qish">MR</button>
        <button class="mem-btn" data-mem="M+" title="Xotiraga qo'shish">M+</button>
        <button class="mem-btn" data-mem="M-" title="Xotiradan ayirish">M-</button>
        <button class="mem-btn" data-mem="MS" title="Xotirada saqlash">MS</button>
      </div>

      <!-- Scientific Panel (Toggled) -->
      <div class="keypad-scientific hidden" id="scientificPanel">
        <button class="btn btn-sci" data-action="sci" data-value="sin">sin</button>
        <button class="btn btn-sci" data-action="sci" data-value="cos">cos</button>
        <button class="btn btn-sci" data-action="sci" data-value="tan">tan</button>
        <button class="btn btn-sci" data-action="sci" data-value="sqrt">√x</button>

        <button class="btn btn-sci" data-action="sci" data-value="log">log</button>
        <button class="btn btn-sci" data-action="sci" data-value="ln">ln</button>
        <button class="btn btn-sci" data-action="sci" data-value="square">x²</button>
        <button class="btn btn-sci" data-action="operator" data-value="^">xʸ</button>

        <button class="btn btn-sci" data-action="sci" data-value="fact">n!</button>
        <button class="btn btn-sci" data-action="sci" data-value="pi">π</button>
        <button class="btn btn-sci" data-action="sci" data-value="e">e</button>
        <button class="btn btn-sci" data-action="sci" data-value="abs">|x|</button>
      </div>

      <!-- Standard Keypad -->
      <div class="keypad-standard">
        <!-- Row 1 -->
        <button class="btn btn-func btn-clear" data-action="clear" id="clearBtn">AC</button>
        <button class="btn btn-func" data-action="delete" title="O'chirish (Backspace)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button class="btn btn-func" data-action="operator" data-value="%">%</button>
        <button class="btn btn-op" data-action="operator" data-value="/">÷</button>

        <!-- Row 2 -->
        <button class="btn btn-num" data-action="num" data-value="7">7</button>
        <button class="btn btn-num" data-action="num" data-value="8">8</button>
        <button class="btn btn-num" data-action="num" data-value="9">9</button>
        <button class="btn btn-op" data-action="operator" data-value="*">×</button>

        <!-- Row 3 -->
        <button class="btn btn-num" data-action="num" data-value="4">4</button>
        <button class="btn btn-num" data-action="num" data-value="5">5</button>
        <button class="btn btn-num" data-action="num" data-value="6">6</button>
        <button class="btn btn-op" data-action="operator" data-value="-">−</button>

        <!-- Row 4 -->
        <button class="btn btn-num" data-action="num" data-value="1">1</button>
        <button class="btn btn-num" data-action="num" data-value="2">2</button>
        <button class="btn btn-num" data-action="num" data-value="3">3</button>
        <button class="btn btn-op" data-action="operator" data-value="+">+</button>

        <!-- Row 5 -->
        <button class="btn btn-num" data-action="negate">±</button>
        <button class="btn btn-num" data-action="num" data-value="0">0</button>
        <button class="btn btn-num" data-action="num" data-value=".">.</button>
        <button class="btn btn-equals" data-action="calculate">=</button>
      </div>

      <!-- Quick Tips Footer -->
      <footer class="calc-footer">
        <span>Klaviatura: <kbd>0-9</kbd>, <kbd>Enter</kbd>, <kbd>Esc</kbd>, <kbd>⌫</kbd></span>
      </footer>
    </section>

    <!-- History Panel Slide-in -->
    <aside class="history-drawer" id="historyDrawer" aria-label="Tarix oynasi">
      <div class="history-header">
        <h3>Amallar Tarixi</h3>
        <div class="history-header-actions">
          <button id="clearHistoryBtn" class="text-btn" title="Tarixni tozalash">Tozalash</button>
          <button id="closeHistoryBtn" class="icon-btn-sm" aria-label="Yopish">✕</button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <p>Hozircha tarix mavjud emas</p>
        </div>
      </div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
